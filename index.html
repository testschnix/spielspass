<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown mit Wartemännchen</title>
<style>
  :root{
    --bg:#1d2b3a; --panel:#26384b; --ink:#f3ead7; --muted:#9db0c4;
    --accent:#ffb347; --line:#3a5068;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; padding:20px;
  }
  main{width:100%; max-width:760px}
  h1{font-size:1.6rem; margin:0 0 6px}
  p.sub{margin:0 0 22px; color:var(--muted)}
  .picker{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:26px}
  label{display:flex; flex-direction:column; gap:4px; font-size:.9rem; color:var(--muted)}
  input,button{
    font:inherit; padding:10px 12px; border-radius:6px;
    border:2px solid var(--line); background:var(--panel); color:var(--ink);
  }
  button{background:var(--accent); color:#1d2b3a; border-color:var(--accent); font-weight:700; cursor:pointer}
  button:hover{filter:brightness(1.08)}
  :focus-visible{outline:3px solid #fff; outline-offset:2px}
  .stage{
    display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap; justify-content:center;
    background:var(--panel); border:2px solid var(--line); border-radius:10px;
    padding:28px 20px 0; overflow:hidden;
  }
  .clock{padding-bottom:28px; text-align:center; flex:1; min-width:260px}
  .title{color:var(--muted); margin-bottom:10px; min-height:1.3em}
  .digits{display:flex; gap:10px; justify-content:center}
  .unit{background:var(--bg); border:2px solid var(--line); border-radius:8px; padding:10px 8px; min-width:68px}
  .unit b{display:block; font-size:2.2rem; font-variant-numeric:tabular-nums; font-family:"Courier New",monospace}
  .unit span{font-size:.75rem; color:var(--muted)}
  .guy{display:block; image-rendering:pixelated; width:128px; height:auto}
  .ground{height:12px; background:var(--line); margin:0 -20px; flex-basis:calc(100% + 40px)}
  .done .guy{animation:jump .5s steps(2) infinite}
  @keyframes jump{50%{transform:translateY(-14px)}}
  @media (prefers-reduced-motion:reduce){.done .guy{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Worauf wartest du?</h1>
  <p class="sub">Wähle einen Tag. Das Männchen wartet mit dir.</p>

  <div class="picker">
    <label>Name (optional)
      <input id="name" type="text" placeholder="z. B. Urlaub" maxlength="30">
    </label>
    <label>Datum
      <input id="date" type="date">
    </label>
    <label>Uhrzeit
      <input id="time" type="time" value="00:00">
    </label>
    <button id="start">Countdown starten</button>
  </div>

  <section class="stage" id="stage" aria-live="polite">
    <div class="clock">
      <div class="title" id="title">Noch kein Ziel gewählt</div>
      <div class="digits">
        <div class="unit"><b id="d">--</b><span>Tage</span></div>
        <div class="unit"><b id="h">--</b><span>Std.</span></div>
        <div class="unit"><b id="m">--</b><span>Min.</span></div>
        <div class="unit"><b id="s">--</b><span>Sek.</span></div>
      </div>
    </div>
    <canvas class="guy" id="guy" width="16" height="24" aria-label="Wartendes Pixel-Männchen"></canvas>
    <div class="ground"></div>
  </section>
</main>

<script>
// ---- Pixelart-Männchen (16x24), per Code gezeichnet, mehrere Warte-Posen ----
const C={k:"#141414",s:"#f1c27d",h:"#6b3f1d",b:"#e4572e",p:"#2e6fb7",y:"#ffd23f"};
const cv=document.getElementById("guy"), g=cv.getContext("2d");
const R=(x,y,w,h,c)=>{g.fillStyle=C[c];g.fillRect(x,y,w,h);};

// o: {b: Körper-Versatz, eyes: 'open'|'blink'|'down'|'closed', mouth: 'flat'|'yawn', arms, legs}
function draw(o){
  g.clearRect(0,0,16,24);
  const b=o.b||0;
  // Beine
  if(o.legs==="sit"){
    R(5,21,9,2,"p"); R(14,21,2,2,"k");
  }else{
    R(4,16+b,8,2,"p");
    R(4,18+b,3,4-b,"p"); R(3,22,4,1,"k");
    if(o.legs==="tap"){ R(9,18+b,3,3-b,"p"); R(9,21,4,1,"k"); }
    else{ R(9,18+b,3,4-b,"p"); R(9,22,4,1,"k"); }
  }
  // Körper
  R(4,10+b,8,6,"b");
  // Arme
  if(o.arms==="crossed"){ R(3,12+b,10,2,"b"); R(2,12+b,1,2,"s"); R(13,12+b,1,2,"s"); }
  else if(o.arms==="watch"){
    R(2,10+b,2,4,"b"); R(2,14+b,2,2,"s");
    R(12,10+b,2,2,"b"); R(12,8+b,2,2,"b"); R(12,6+b,2,2,"s"); R(12,9+b,2,1,"y");
  }else if(o.arms==="hips"){
    R(2,10+b,2,2,"b"); R(1,12+b,2,2,"b"); R(3,14+b,1,1,"s");
    R(12,10+b,2,2,"b"); R(13,12+b,2,2,"b"); R(12,14+b,1,1,"s");
  }else if(o.arms==="stretch"){
    R(2,5+b,2,6,"b"); R(2,3+b,2,2,"s"); R(12,5+b,2,6,"b"); R(12,3+b,2,2,"s");
  }else{
    R(2,10+b,2,4,"b"); R(2,14+b,2,2,"s"); R(12,10+b,2,4,"b"); R(12,14+b,2,2,"s");
  }
  // Kopf
  const hx=o.head||0;
  R(4+hx,1+b,8,2,"h"); R(3+hx,2+b,1,3,"h"); R(12+hx,2+b,1,3,"h");
  R(4+hx,3+b,8,6,"s");
  const ey=o.eyes==="down"?6:5;
  if(o.eyes==="blink"||o.eyes==="closed"){ R(6+hx,6+b,1,1,"k"); R(9+hx,6+b,1,1,"k"); }
  else{ R(6+hx,ey+b,1,2,"k"); R(9+hx,ey+b,1,2,"k"); }
  if(o.mouth==="yawn") R(7+hx,7+b,2,2,"k"); else R(7+hx,8+b,2,1,"k");
}

// Jede Pose liefert pro Frame (alle 400 ms) die Zeichenparameter
const POSES=[
  f=>({b:f%4<2?0:1, eyes:f%7===3?"blink":"open", arms:"down"}),                 // ruhig stehen, atmen
  f=>({legs:f%2?"tap":"stand", eyes:"open", arms:"down", head:f%2?0:0}),         // mit dem Fuß tippen
  f=>({arms:"watch", eyes:"down", head:-1, b:0}),                                 // auf die Uhr schauen
  f=>({arms:"crossed", eyes:f%5===2?"blink":"open", legs:f%4<2?"stand":"tap"}),   // Arme verschränkt
  f=>({arms:"hips", eyes:"open", head:f%4<2?-1:1}),                               // Hände in die Hüften, umschauen
  f=>({arms:"stretch", eyes:"closed", mouth:"yawn", b:0}),                        // gähnen und strecken
  f=>({legs:"sit", b:5, arms:"down", eyes:f%6===4?"blink":"open"})                // hingesetzt
];
let frame=0;
function animate(){
  const pose=Math.floor(frame/12)%POSES.length;   // alle ~5 s neue Pose
  draw(POSES[pose](frame));
  frame++;
}
animate(); setInterval(animate,400);

// ---- Countdown ----
const $ = id => document.getElementById(id);
let target = null, timer = null;
const pad = n => String(n).padStart(2,"0");

function tick(){
  const diff = target - Date.now();
  if(diff <= 0){
    ["d","h","m","s"].forEach(i => $(i).textContent="00");
    $("stage").classList.add("done");
    $("title").textContent = ($("name").value || "Ziel") + " – es ist so weit!";
    clearInterval(timer);
    return;
  }
  const sec = Math.floor(diff/1000);
  $("d").textContent = pad(Math.floor(sec/86400));
  $("h").textContent = pad(Math.floor(sec%86400/3600));
  $("m").textContent = pad(Math.floor(sec%3600/60));
  $("s").textContent = pad(sec%60);
}

function start(){
  if(!$("date").value){ $("title").textContent = "Bitte zuerst ein Datum wählen."; return; }
  target = new Date($("date").value + "T" + ($("time").value || "00:00")).getTime();
  $("stage").classList.remove("done");
  $("title").textContent = "Bis: " + ($("name").value ? $("name").value + " – " : "") +
    new Date(target).toLocaleString("de-DE",{dateStyle:"full",timeStyle:"short"});
  try{ localStorage.setItem("cd", JSON.stringify({n:$("name").value,d:$("date").value,t:$("time").value})); }catch(e){}
  clearInterval(timer); tick(); timer = setInterval(tick,1000);
}
$("start").addEventListener("click", start);

// Gespeichertes Ziel wiederherstellen
try{
  const s = JSON.parse(localStorage.getItem("cd")||"null");
  if(s){ $("name").value=s.n; $("date").value=s.d; $("time").value=s.t; start(); }
}catch(e){}
</script>
</body>
</html>
